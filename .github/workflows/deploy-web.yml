name: Deploy Web

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR image tag to deploy. Defaults to master.
        required: false
        default: master
      environment:
        description: GitHub environment to read secrets from.
        required: false
        default: production
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  packages: read
  issues: write

env:
  NAMESPACE: betterdata
  IMAGE: ghcr.io/kevin-nav/betterdata-web
  IMAGE_TAG: ${{ inputs.image_tag || 'master' }}
  PUBLIC_APP_URL: ${{ secrets.PUBLIC_APP_URL }}
  PUBLIC_ADMIN_URL: ${{ secrets.PUBLIC_ADMIN_URL }}
  API_BASE_URL: ${{ secrets.API_BASE_URL }}
  NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
  NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
  NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
  NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST || 'https://us.i.posthog.com' }}
  NEXT_PUBLIC_POSTHOG_ENVIRONMENT: ${{ secrets.NEXT_PUBLIC_POSTHOG_ENVIRONMENT || 'production' }}
  NEXT_PUBLIC_POSTHOG_REPLAY_SAMPLE_RATE: ${{ secrets.NEXT_PUBLIC_POSTHOG_REPLAY_SAMPLE_RATE || '0.1' }}
  CLOUDFLARED_TOKEN: ${{ secrets.CLOUDFLARED_TOKEN }}
  GHCR_READ_USERNAME: ${{ secrets.GHCR_READ_USERNAME }}
  GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  deploy:
    name: Apply manifests and rollout
    runs-on:
      - self-hosted
      - linux
      - x64
      - betterdata
      - k3s
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required tools
        run: |
          sudo -n kubectl version --client

      - name: Apply base manifests
        run: sudo -n kubectl apply -k deploy/k8s/base

      - name: Sync web runtime secrets
        run: |
          sudo -n kubectl -n "$NAMESPACE" create secret generic betterdata-web-env \
            --from-literal=NODE_ENV=production \
            --from-literal=PORT=3000 \
            --from-literal=HOSTNAME=0.0.0.0 \
            --from-literal=PUBLIC_APP_URL="$PUBLIC_APP_URL" \
            --from-literal=PUBLIC_ADMIN_URL="$PUBLIC_ADMIN_URL" \
            --from-literal=API_BASE_URL="$API_BASE_URL" \
            --from-literal=NEXT_PUBLIC_API_BASE_URL="$NEXT_PUBLIC_API_BASE_URL" \
            --from-literal=NEXT_PUBLIC_CONVEX_URL="$NEXT_PUBLIC_CONVEX_URL" \
            --from-literal=NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN="$NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN" \
            --from-literal=NEXT_PUBLIC_POSTHOG_HOST="$NEXT_PUBLIC_POSTHOG_HOST" \
            --from-literal=NEXT_PUBLIC_POSTHOG_ENVIRONMENT="$NEXT_PUBLIC_POSTHOG_ENVIRONMENT" \
            --from-literal=NEXT_PUBLIC_POSTHOG_REPLAY_SAMPLE_RATE="$NEXT_PUBLIC_POSTHOG_REPLAY_SAMPLE_RATE" \
            --dry-run=client -o yaml | sudo -n kubectl apply -f -

      - name: Sync Cloudflare tunnel token
        run: |
          test -n "$CLOUDFLARED_TOKEN"
          sudo -n kubectl -n "$NAMESPACE" create secret generic betterdata-cloudflared \
            --from-literal=token="$CLOUDFLARED_TOKEN" \
            --dry-run=client -o yaml | sudo -n kubectl apply -f -

      - name: Sync GHCR image pull secret
        run: |
          username="${GHCR_READ_USERNAME:-$GITHUB_ACTOR}"
          token="${GHCR_READ_TOKEN:-$GITHUB_TOKEN}"
          sudo -n kubectl -n "$NAMESPACE" create secret docker-registry ghcr-auth \
            --docker-server=ghcr.io \
            --docker-username="$username" \
            --docker-password="$token" \
            --dry-run=client -o yaml | sudo -n kubectl apply -f -

      - name: Deploy selected image
        run: |
          sudo -n kubectl -n "$NAMESPACE" set image deployment/betterdata-web web="$IMAGE:$IMAGE_TAG"
          sudo -n kubectl -n "$NAMESPACE" rollout restart deployment/betterdata-web
          sudo -n kubectl -n "$NAMESPACE" rollout status deployment/betterdata-web --timeout=180s
          sudo -n kubectl -n "$NAMESPACE" rollout status deployment/betterdata-cloudflared --timeout=180s

  notify-failure:
    name: Notify Deploy Failure
    runs-on: ubuntu-latest
    needs:
      - deploy
    if: failure()
    permissions:
      issues: write
      contents: read
    steps:
      - name: Create or update failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_TITLE: Deployment failure on BetterData web
        run: |
          gh label create ci-failure --repo "$REPO" --color D73A4A --description "CI/CD failures" || true
          existing_issue="$(gh issue list --repo "$REPO" --state open --label ci-failure --json number,title --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -n 1)"
          body="The BetterData web deployment failed.

          Workflow run: $RUN_URL
          Image tag: $IMAGE_TAG
          Branch: $GITHUB_REF_NAME"

          if [ -n "$existing_issue" ]; then
            gh issue comment "$existing_issue" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$ISSUE_TITLE" --label ci-failure --body "$body"
          fi
