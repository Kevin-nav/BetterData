name: Deploy Platform

on:
  workflow_dispatch:
    inputs:
      api_image_tag:
        description: GHCR API image tag to deploy. Leave empty to preserve the currently deployed API image.
        required: false
        default: ""
      web_image_tag:
        description: GHCR web image tag to deploy. Leave empty to preserve the currently deployed web image.
        required: false
        default: ""
      admin_image_tag:
        description: GHCR admin image tag to deploy. Leave empty to preserve the currently deployed admin image.
        required: false
        default: ""
      environment:
        description: GitHub environment to read bootstrap secrets from.
        required: false
        default: production
  workflow_run:
    workflows:
      - Build and Push API
      - Build and Push Web
      - Build and Push Admin
    branches:
      - master
    types:
      - completed

permissions:
  contents: read
  packages: read
  issues: write

env:
  NAMESPACE: betterdata
  API_IMAGE: ghcr.io/kevin-nav/betterdata-api
  WEB_IMAGE: ghcr.io/kevin-nav/betterdata-web
  ADMIN_IMAGE: ghcr.io/kevin-nav/betterdata-admin
  PUBLIC_APP_URL: ${{ secrets.PUBLIC_APP_URL }}
  PUBLIC_ADMIN_URL: ${{ secrets.PUBLIC_ADMIN_URL }}
  API_BASE_URL: ${{ secrets.API_BASE_URL }}
  NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
  NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
  NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
  CLOUDFLARED_TOKEN: ${{ secrets.CLOUDFLARED_TOKEN }}
  GHCR_READ_USERNAME: ${{ secrets.GHCR_READ_USERNAME }}
  GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
  INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
  INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
  INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
  INFISICAL_ENVIRONMENT: ${{ secrets.INFISICAL_ENVIRONMENT || 'prod' }}
  INFISICAL_SECRET_PATH: ${{ secrets.INFISICAL_SECRET_PATH || '/' }}
  GITHUB_TOKEN: ${{ github.token }}

concurrency:
  group: production-platform
  cancel-in-progress: true

jobs:
  deploy:
    name: Sync secrets, roll out, and verify
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on:
      - self-hosted
      - linux
      - x64
      - betterdata
      - k3s
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - name: Resolve checkout ref
        id: checkout-ref
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            echo "checkout_ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "checkout_ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.checkout-ref.outputs.checkout_ref }}
          fetch-depth: 2

      - name: Resolve deployment inputs
        id: deploy-inputs
        run: |
          if [ "$GITHUB_EVENT_NAME" != "workflow_run" ]; then
            api_tag="${{ inputs.api_image_tag }}"
            web_tag="${{ inputs.web_image_tag }}"
            admin_tag="${{ inputs.admin_image_tag }}"
            echo "api_tag=$api_tag" >> "$GITHUB_OUTPUT"
            echo "web_tag=$web_tag" >> "$GITHUB_OUTPUT"
            echo "admin_tag=$admin_tag" >> "$GITHUB_OUTPUT"
            if [ -n "$api_tag" ]; then
              echo "wait_api=true" >> "$GITHUB_OUTPUT"
            else
              echo "wait_api=false" >> "$GITHUB_OUTPUT"
            fi
            if [ -n "$web_tag" ]; then
              echo "wait_web=true" >> "$GITHUB_OUTPUT"
            else
              echo "wait_web=false" >> "$GITHUB_OUTPUT"
            fi
            if [ -n "$admin_tag" ]; then
              echo "wait_admin=true" >> "$GITHUB_OUTPUT"
            else
              echo "wait_admin=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          short_sha="$(git rev-parse --short=7 HEAD)"
          before="$(git rev-parse HEAD^ 2>/dev/null || true)"
          if [ -n "$before" ]; then
            changed="$(git diff --name-only "$before" HEAD)"
          else
            changed="$(git show --pretty='' --name-only HEAD)"
          fi

          api_changed=false
          web_changed=false
          admin_changed=false

          if printf '%s\n' "$changed" | grep -Eq '^(\.github/workflows/build-api\.yml|Dockerfile\.api|apps/api/|convex/|packages/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.base\.json|turbo\.json)'; then
            api_changed=true
          fi

          if printf '%s\n' "$changed" | grep -Eq '^(\.github/workflows/build-web\.yml|Dockerfile\.web|apps/web/|convex/|packages/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.base\.json|turbo\.json)'; then
            web_changed=true
          fi

          if printf '%s\n' "$changed" | grep -Eq '^(\.github/workflows/build-admin\.yml|\.github/workflows/deploy-platform\.yml|Dockerfile\.admin|apps/admin/|convex/|deploy/k8s/base/admin-|packages/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.base\.json|turbo\.json)'; then
            admin_changed=true
          fi

          if [ "$api_changed" = "true" ]; then
            echo "api_tag=sha-$short_sha" >> "$GITHUB_OUTPUT"
            echo "wait_api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api_tag=" >> "$GITHUB_OUTPUT"
            echo "wait_api=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$web_changed" = "true" ]; then
            echo "web_tag=sha-$short_sha" >> "$GITHUB_OUTPUT"
            echo "wait_web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web_tag=" >> "$GITHUB_OUTPUT"
            echo "wait_web=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$admin_changed" = "true" ]; then
            echo "admin_tag=sha-$short_sha" >> "$GITHUB_OUTPUT"
            echo "wait_admin=true" >> "$GITHUB_OUTPUT"
          else
            echo "admin_tag=" >> "$GITHUB_OUTPUT"
            echo "wait_admin=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify required tools
        run: |
          sudo -n kubectl version --client
          command -v curl
          command -v jq

      - name: Install Infisical CLI
        run: |
          if command -v infisical >/dev/null 2>&1; then
            infisical --version
            exit 0
          fi
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get update
          sudo apt-get install -y infisical

      - name: Authenticate Infisical
        run: |
          test -n "$INFISICAL_CLIENT_ID"
          test -n "$INFISICAL_CLIENT_SECRET"
          test -n "$INFISICAL_PROJECT_ID"
          token="$(infisical login --method=universal-auth --client-id="$INFISICAL_CLIENT_ID" --client-secret="$INFISICAL_CLIENT_SECRET" --silent --plain)"
          echo "::add-mask::$token"
          echo "INFISICAL_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Wait for image tags
        run: |
          username="${GHCR_READ_USERNAME:-$GITHUB_ACTOR}"
          token="${GHCR_READ_TOKEN:-$GITHUB_TOKEN}"
          if command -v docker >/dev/null 2>&1; then
            echo "$token" | docker login ghcr.io -u "$username" --password-stdin
            images=""
            if [ "${{ steps.deploy-inputs.outputs.wait_api }}" = "true" ]; then
              images="$images $API_IMAGE:${{ steps.deploy-inputs.outputs.api_tag }}"
            fi
            if [ "${{ steps.deploy-inputs.outputs.wait_web }}" = "true" ]; then
              images="$images $WEB_IMAGE:${{ steps.deploy-inputs.outputs.web_tag }}"
            fi
            if [ "${{ steps.deploy-inputs.outputs.wait_admin }}" = "true" ]; then
              images="$images $ADMIN_IMAGE:${{ steps.deploy-inputs.outputs.admin_tag }}"
            fi
            if [ -z "$images" ]; then
              echo "No SHA image tags need to be awaited."
              exit 0
            fi
            for image in $images; do
              for attempt in $(seq 1 30); do
                if docker manifest inspect "$image" >/dev/null 2>&1; then
                  echo "Found $image"
                  break
                fi
                if [ "$attempt" -eq 30 ]; then
                  echo "Image tag was not available: $image" >&2
                  exit 1
                fi
                sleep 20
              done
            done
          else
            echo "Docker CLI not available on runner; skipping image tag preflight."
          fi

      - name: Export API runtime secrets
        run: |
          infisical export \
            --projectId="$INFISICAL_PROJECT_ID" \
            --env="$INFISICAL_ENVIRONMENT" \
            --path="$INFISICAL_SECRET_PATH" \
            --format=json \
            --output-file=api.json
          jq -r '
            def secret_entries:
              if type == "array" then
                map({
                  key: (.key // .secretKey // .name),
                  value: (.value // .secretValue // "")
                })
              elif type == "object" then
                to_entries
              else
                []
              end;
            secret_entries[]
            | select(.key | test("^[A-Za-z_][A-Za-z0-9_]*$"))
            | "\(.key)=\((.value // "") | tostring | gsub("\r"; "") | gsub("\n"; "\\n"))"
          ' api.json > api.clean.env
          invalid_keys="$(jq -r '
            def secret_entries:
              if type == "array" then
                map({
                  key: (.key // .secretKey // .name),
                  value: (.value // .secretValue // "")
                })
              elif type == "object" then
                to_entries
              else
                []
              end;
            secret_entries[]
            | .key
            | select(test("^[A-Za-z_][A-Za-z0-9_]*$") | not)
          ' api.json | paste -sd "," -)"
          if [ -n "$invalid_keys" ]; then
            echo "Ignored invalid Infisical env key names: $invalid_keys"
          fi
          required_keys="
          NODE_ENV
          PUBLIC_APP_URL
          PUBLIC_ADMIN_URL
          API_BASE_URL
          QUEUE_PROVIDER
          CLOUDAMQP_URL
          UPSTASH_REDIS_REST_URL
          UPSTASH_REDIS_REST_TOKEN
          WEBHOOK_HMAC_SECRET
          BETTERDATA_ACTIVE_DATA_VENDOR
          BETTERDATA_SERVICE_SECRET
          CONVEX_URL
          CONVEX_API_SECRET
          FIREBASE_PROJECT_ID
          FIREBASE_CLIENT_EMAIL
          FIREBASE_PRIVATE_KEY
          PAYSTACK_SECRET_KEY
          PAYSTACK_PUBLIC_KEY
          RESEND_API_KEY
          SUPPORT_EMAIL
          HONEYCOMB_API_KEY
          HONEYCOMB_CONFIG_API_KEY
          HONEYCOMB_ALERT_EMAIL
          TELEMETRY_HASH_SECRET
          DATAMART_API_KEY
          "
          missing_keys=""
          for key in $required_keys; do
            if ! grep -Eq "^${key}=.+" api.clean.env; then
              missing_keys="${missing_keys}${missing_keys:+,}$key"
            fi
          done
          if [ -n "$missing_keys" ]; then
            echo "Missing required production API secret keys in Infisical: $missing_keys" >&2
            exit 1
          fi
          read_env() {
            grep -E "^$1=" api.clean.env | head -n 1 | cut -d= -f2-
          }
          prod_convex_url="$(read_env CONVEX_URL | sed 's#/*$##')"
          honeycomb_dataset="$(read_env HONEYCOMB_DATASET)"
          honeycomb_config_key="$(read_env HONEYCOMB_CONFIG_API_KEY)"
          honeycomb_alert_email="$(read_env HONEYCOMB_ALERT_EMAIL)"
          echo "::add-mask::$honeycomb_config_key"
          echo "NEXT_PUBLIC_CONVEX_URL=$prod_convex_url" >> "$GITHUB_ENV"
          echo "HONEYCOMB_DATASET=${honeycomb_dataset:-betterdata-prod}" >> "$GITHUB_ENV"
          echo "HONEYCOMB_CONFIG_API_KEY=$honeycomb_config_key" >> "$GITHUB_ENV"
          echo "HONEYCOMB_ALERT_EMAIL=$honeycomb_alert_email" >> "$GITHUB_ENV"

      - name: Capture current deployment images
        id: current-images
        run: |
          current_api="$(sudo -n kubectl -n "$NAMESPACE" get deployment betterdata-api -o jsonpath='{.spec.template.spec.containers[?(@.name=="api")].image}' 2>/dev/null || true)"
          current_web="$(sudo -n kubectl -n "$NAMESPACE" get deployment betterdata-web -o jsonpath='{.spec.template.spec.containers[?(@.name=="web")].image}' 2>/dev/null || true)"
          current_admin="$(sudo -n kubectl -n "$NAMESPACE" get deployment betterdata-admin -o jsonpath='{.spec.template.spec.containers[?(@.name=="admin")].image}' 2>/dev/null || true)"
          echo "api_image=$current_api" >> "$GITHUB_OUTPUT"
          echo "web_image=$current_web" >> "$GITHUB_OUTPUT"
          echo "admin_image=$current_admin" >> "$GITHUB_OUTPUT"

      - name: Resolve target deployment images
        id: target-images
        run: |
          api_tag="${{ steps.deploy-inputs.outputs.api_tag }}"
          web_tag="${{ steps.deploy-inputs.outputs.web_tag }}"
          admin_tag="${{ steps.deploy-inputs.outputs.admin_tag }}"
          current_api="${{ steps.current-images.outputs.api_image }}"
          current_web="${{ steps.current-images.outputs.web_image }}"
          current_admin="${{ steps.current-images.outputs.admin_image }}"

          if [ -n "$api_tag" ]; then
            api_ref="$API_IMAGE:$api_tag"
          else
            api_ref="$current_api"
          fi

          if [ -n "$web_tag" ]; then
            web_ref="$WEB_IMAGE:$web_tag"
          else
            web_ref="$current_web"
          fi

          if [ -n "$admin_tag" ]; then
            admin_ref="$ADMIN_IMAGE:$admin_tag"
          else
            admin_ref="$current_admin"
          fi

          if [ -z "$api_ref" ] || [ -z "$web_ref" ] || [ -z "$admin_ref" ]; then
            echo "No current deployment image exists and no replacement tag was supplied." >&2
            echo "API image: ${api_ref:-<missing>}" >&2
            echo "Web image: ${web_ref:-<missing>}" >&2
            echo "Admin image: ${admin_ref:-<missing>}" >&2
            exit 1
          fi

          echo "api_ref=$api_ref" >> "$GITHUB_OUTPUT"
          echo "web_ref=$web_ref" >> "$GITHUB_OUTPUT"
          echo "admin_ref=$admin_ref" >> "$GITHUB_OUTPUT"

      - name: Apply namespace
        run: sudo -n kubectl apply -f deploy/k8s/base/namespace.yaml

      - name: Sync API runtime secrets
        run: |
          sudo -n kubectl -n "$NAMESPACE" create secret generic betterdata-api-env \
            --from-env-file=api.clean.env \
            --dry-run=client -o yaml | sudo -n kubectl apply -f -
          rm -f api.json api.clean.env

      - name: Sync web runtime secrets
        run: |
          sudo -n kubectl -n "$NAMESPACE" create secret generic betterdata-web-env \
            --from-literal=NODE_ENV=production \
            --from-literal=PORT=3000 \
            --from-literal=HOSTNAME=0.0.0.0 \
            --from-literal=PUBLIC_APP_URL="$PUBLIC_APP_URL" \
            --from-literal=PUBLIC_ADMIN_URL="$PUBLIC_ADMIN_URL" \
            --from-literal=API_BASE_URL="$API_BASE_URL" \
            --from-literal=NEXT_PUBLIC_API_BASE_URL="$NEXT_PUBLIC_API_BASE_URL" \
            --from-literal=NEXT_PUBLIC_CONVEX_URL="$NEXT_PUBLIC_CONVEX_URL" \
            --from-literal=NEXT_PUBLIC_FIREBASE_API_KEY="$NEXT_PUBLIC_FIREBASE_API_KEY" \
            --from-literal=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="$NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN" \
            --from-literal=NEXT_PUBLIC_FIREBASE_PROJECT_ID="$NEXT_PUBLIC_FIREBASE_PROJECT_ID" \
            --dry-run=client -o yaml | sudo -n kubectl apply -f -

      - name: Sync admin runtime secrets
        run: |
          sudo -n kubectl -n "$NAMESPACE" create secret generic betterdata-admin-env \
            --from-literal=NODE_ENV=production \
            --from-literal=PORT=3001 \
            --from-literal=HOSTNAME=0.0.0.0 \
            --from-literal=PUBLIC_APP_URL="$PUBLIC_APP_URL" \
            --from-literal=PUBLIC_ADMIN_URL="$PUBLIC_ADMIN_URL" \
            --from-literal=API_BASE_URL="$API_BASE_URL" \
            --from-literal=NEXT_PUBLIC_API_BASE_URL="$NEXT_PUBLIC_API_BASE_URL" \
            --from-literal=NEXT_PUBLIC_CONVEX_URL="$NEXT_PUBLIC_CONVEX_URL" \
            --from-literal=NEXT_PUBLIC_FIREBASE_API_KEY="$NEXT_PUBLIC_FIREBASE_API_KEY" \
            --from-literal=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="$NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN" \
            --from-literal=NEXT_PUBLIC_FIREBASE_PROJECT_ID="$NEXT_PUBLIC_FIREBASE_PROJECT_ID" \
            --dry-run=client -o yaml | sudo -n kubectl apply -f -

      - name: Sync Cloudflare tunnel token
        run: |
          test -n "$CLOUDFLARED_TOKEN"
          sudo -n kubectl -n "$NAMESPACE" create secret generic betterdata-cloudflared \
            --from-literal=token="$CLOUDFLARED_TOKEN" \
            --dry-run=client -o yaml | sudo -n kubectl apply -f -

      - name: Sync GHCR image pull secret
        run: |
          username="${GHCR_READ_USERNAME:-$GITHUB_ACTOR}"
          token="${GHCR_READ_TOKEN:-$GITHUB_TOKEN}"
          sudo -n kubectl -n "$NAMESPACE" create secret docker-registry ghcr-auth \
            --docker-server=ghcr.io \
            --docker-username="$username" \
            --docker-password="$token" \
            --dry-run=client -o yaml | sudo -n kubectl apply -f -

      - name: Bootstrap Honeycomb alert recipients
        run: node scripts/ops/bootstrap-honeycomb-alerts.mjs

      - name: Apply target manifests and verify rollout
        id: deploy-images
        run: |
          echo "DEPLOY_STARTED=true" >> "$GITHUB_ENV"
          api_ref="${{ steps.target-images.outputs.api_ref }}"
          web_ref="${{ steps.target-images.outputs.web_ref }}"
          admin_ref="${{ steps.target-images.outputs.admin_ref }}"
          sudo -n kubectl kustomize deploy/k8s/base > rendered-platform.yaml
          sed -i "s#ghcr.io/kevin-nav/betterdata-api:master#$api_ref#g" rendered-platform.yaml
          sed -i "s#ghcr.io/kevin-nav/betterdata-web:master#$web_ref#g" rendered-platform.yaml
          sed -i "s#ghcr.io/kevin-nav/betterdata-admin:master#$admin_ref#g" rendered-platform.yaml
          sudo -n kubectl apply -f rendered-platform.yaml
          sudo -n kubectl -n "$NAMESPACE" rollout status deployment/betterdata-web --timeout=300s
          sudo -n kubectl -n "$NAMESPACE" rollout status deployment/betterdata-admin --timeout=300s
          sudo -n kubectl -n "$NAMESPACE" rollout status deployment/betterdata-api --timeout=300s
          sudo -n kubectl -n "$NAMESPACE" rollout status deployment/betterdata-cloudflared --timeout=180s

      - name: Smoke test production endpoints
        run: |
          set -e
          sudo -n kubectl -n "$NAMESPACE" get deployment betterdata-web betterdata-admin betterdata-api betterdata-worker
          sudo -n kubectl -n "$NAMESPACE" get secret betterdata-api-env betterdata-web-env betterdata-admin-env
          local_port="$((18000 + RANDOM % 1000))"
          sudo -n kubectl -n "$NAMESPACE" port-forward service/betterdata-api "$local_port:4000" >/tmp/betterdata-api-port-forward.log 2>&1 &
          port_forward_pid="$!"
          trap 'kill "$port_forward_pid" >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$local_port/health"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Internal API health smoke failed." >&2
              cat /tmp/betterdata-api-port-forward.log >&2 || true
              exit 1
            fi
            sleep 2
          done

          curl -fsS "http://127.0.0.1:$local_port/data-packages" >/dev/null

          kill "$port_forward_pid" >/dev/null 2>&1 || true
          trap - EXIT

          admin_local_port="$((19000 + RANDOM % 1000))"
          sudo -n kubectl -n "$NAMESPACE" port-forward service/betterdata-admin "$admin_local_port:3001" >/tmp/betterdata-admin-port-forward.log 2>&1 &
          admin_port_forward_pid="$!"
          trap 'kill "$admin_port_forward_pid" >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$admin_local_port/login" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Internal admin login smoke failed." >&2
              cat /tmp/betterdata-admin-port-forward.log >&2 || true
              exit 1
            fi
            sleep 2
          done

          if [ -n "$API_BASE_URL" ] && ! curl -fsS --max-time 15 "$API_BASE_URL/health" >/dev/null; then
            echo "::warning::External API health smoke failed for API_BASE_URL. Internal Kubernetes service smoke passed, so rollout will not be rolled back."
          fi

      - name: Roll back on failure
        if: failure()
        run: |
          if [ "${DEPLOY_STARTED:-false}" != "true" ]; then
            echo "Rollout did not start; skipping rollback."
            rm -f api.json api.clean.env rendered-platform.yaml
            exit 0
          fi
          previous_web="${{ steps.current-images.outputs.web_image }}"
          previous_api="${{ steps.current-images.outputs.api_image }}"
          previous_admin="${{ steps.current-images.outputs.admin_image }}"
          if [ -n "$previous_web" ]; then
            sudo -n kubectl -n "$NAMESPACE" set image deployment/betterdata-web web="$previous_web" || true
          fi
          if [ -n "$previous_admin" ]; then
            sudo -n kubectl -n "$NAMESPACE" set image deployment/betterdata-admin admin="$previous_admin" || true
          fi
          if [ -n "$previous_api" ]; then
            sudo -n kubectl -n "$NAMESPACE" set image deployment/betterdata-api api="$previous_api" || true
            sudo -n kubectl -n "$NAMESPACE" set image deployment/betterdata-worker worker="$previous_api" || true
          fi
          sudo -n kubectl -n "$NAMESPACE" rollout status deployment/betterdata-web --timeout=90s || true
          sudo -n kubectl -n "$NAMESPACE" rollout status deployment/betterdata-admin --timeout=90s || true
          sudo -n kubectl -n "$NAMESPACE" rollout status deployment/betterdata-api --timeout=90s || true
          rm -f api.json api.clean.env rendered-platform.yaml

  notify-failure:
    name: Notify Deploy Failure
    runs-on: ubuntu-latest
    needs:
      - deploy
    if: failure()
    permissions:
      issues: write
      contents: read
    steps:
      - name: Create or update failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_TITLE: Deployment failure on BetterData platform
        run: |
          gh label create ci-failure --repo "$REPO" --color D73A4A --description "CI/CD failures" || true
          existing_issue="$(gh issue list --repo "$REPO" --state open --label ci-failure --json number,title --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -n 1)"
          body="The BetterData platform deployment failed.

          Workflow run: $RUN_URL
          Branch: $GITHUB_REF_NAME"

          if [ -n "$existing_issue" ]; then
            gh issue comment "$existing_issue" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$ISSUE_TITLE" --label ci-failure --body "$body"
          fi
