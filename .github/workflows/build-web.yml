name: Build and Push Web

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  issues: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kevin-nav/betterdata-web

jobs:
  build:
    name: Validate, Build, and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm --filter @betterdata/web... build

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=master

      - name: Build and push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-failure:
    name: Notify Build Failure
    runs-on: ubuntu-latest
    needs:
      - build
    if: failure()
    permissions:
      issues: write
      contents: read
    steps:
      - name: Create or update failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_TITLE: CI failure on master web build
        run: |
          gh label create ci-failure --repo "$REPO" --color D73A4A --description "CI/CD failures" || true
          existing_issue="$(gh issue list --repo "$REPO" --state open --label ci-failure --json number,title --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -n 1)"
          body="The BetterData web build failed.

          Workflow run: $RUN_URL
          Commit: $GITHUB_SHA
          Branch: $GITHUB_REF_NAME"

          if [ -n "$existing_issue" ]; then
            gh issue comment "$existing_issue" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$ISSUE_TITLE" --label ci-failure --body "$body"
          fi
