apiVersion: apps/v1
kind: Deployment
metadata:
  name: betterdata-api
  namespace: betterdata
  labels:
    app.kubernetes.io/name: betterdata-api
    app.kubernetes.io/part-of: betterdata
spec:
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 15
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: betterdata-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: betterdata-api
        app.kubernetes.io/part-of: betterdata
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-auth
      containers:
        - name: api
          image: ghcr.io/kevin-nav/betterdata-api:master
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "4000"
            - name: HOST
              value: 0.0.0.0
          envFrom:
            - secretRef:
                name: betterdata-api-env
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - sleep 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
