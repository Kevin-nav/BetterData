apiVersion: apps/v1
kind: Deployment
metadata:
  name: betterdata-admin
  namespace: betterdata
  labels:
    app.kubernetes.io/name: betterdata-admin
    app.kubernetes.io/part-of: betterdata
spec:
  replicas: 1
  revisionHistoryLimit: 5
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: betterdata-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: betterdata-admin
        app.kubernetes.io/part-of: betterdata
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-auth
      containers:
        - name: admin
          image: ghcr.io/kevin-nav/betterdata-admin:master
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - secretRef:
                name: betterdata-admin-env
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - sleep 10
          resources:
            requests:
              cpu: 10m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
